# Mail server — deployed as a Coolify resource.
#
# Mailcow is a complete, self-contained mail server with antispam (Rspamd),
# antivirus (ClamAV), webmail (SOGo), and a web admin UI. It manages its own
# MariaDB and Redis — it does not share Coolify's Postgres or Redis.
#
# BEFORE YOU START:
#   1. Clone mailcow: https://github.com/mailcow/mailcow-dockerized
#   2. Run ./generate_config.sh to create mailcow.conf
#   3. Edit mailcow.conf: set MAILCOW_HOSTNAME=mail.yaseen.pk
#   4. Copy mailcow.conf to this directory (or mount it — see below)
#   5. Deploy this resource in Coolify in a SEPARATE project from the store
#
# Ports 25, 465, 587, 143, 993 are published on the host directly — SMTP and
# IMAP are not HTTP and there is nothing for Traefik to route.
#
# Ports 80 and 443 belong to Coolify's Traefik. Set the domain mail.yaseen.pk
# on this resource in Coolify's UI and Traefik will route and certificate the
# admin UI on 8080.
#
# BEFORE THIS DELIVERS ANYTHING, the DNS and reverse-DNS work in docs/email.md
# has to be done. As of writing, yaseen.pk has no SPF, DKIM or DMARC and its
# PTR still points at a generic Contabo hostname.
#
# Resource usage: ~4-6 GB RAM at idle (Rspamd + ClamAV + SOGo + MariaDB).
# Your Contabo VPS has 12 GB — this leaves 6-8 GB for the store.

services:
  # --- Core mail ---
  postfix-mailcow:
    image: ghcr.io/mailcow/mailcow:postfix
    restart: unless-stopped
    hostname: mail.yaseen.pk
    environment:
      TZ: Asia/Karachi
    volumes:
      - mailcow-data:/var/vmail
      - ./mailcow.conf:/etc/mailcow.conf:ro
    networks:
      - mail-network

  dovecot-mailcow:
    image: ghcr.io/mailcow/mailcow:dovecot
    restart: unless-stopped
    hostname: mail.yaseen.pk
    environment:
      TZ: Asia/Karachi
    volumes:
      - mailcow-data:/var/vmail
      - ./mailcow.conf:/etc/mailcow.conf:ro
    networks:
      - mail-network

  # --- Antispam ---
  rspamd-mailcow:
    image: ghcr.io/mailcow/mailcow:rspamd
    restart: unless-stopped
    environment:
      TZ: Asia/Karachi
    volumes:
      - rspamd-data:/var/lib/rspamd
      - ./mailcow.conf:/etc/mailcow.conf:ro
    networks:
      - mail-network

  # --- Antivirus ---
  clamd-mailcow:
    image: ghcr.io/mailcow/mailcow:clamd
    restart: unless-stopped
    environment:
      TZ: Asia/Karachi
    volumes:
      - clamd-data:/var/lib/clamav
      - ./mailcow.conf:/etc/mailcow.conf:ro
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - mail-network

  # --- Webmail + Admin UI ---
  sogo-mailcow:
    image: ghcr.io/mailcow/mailcow:sogo
    restart: unless-stopped
    environment:
      TZ: Asia/Karachi
    volumes:
      - sogo-data:/srv
      - ./mailcow.conf:/etc/mailcow.conf:ro
    networks:
      - mail-network

  nginx-mailcow:
    image: ghcr.io/mailcow/mailcow:nginx
    restart: unless-stopped
    environment:
      TZ: Asia/Karachi
    volumes:
      - ./mailcow.conf:/etc/mailcow.conf:ro
    networks:
      - mail-network

  # --- DNS resolver (internal) ---
  unbound-mailcow:
    image: ghcr.io/mailcow/mailcow:unbound
    restart: unless-stopped
    environment:
      TZ: Asia/Karachi
    networks:
      - mail-network

  # --- Cache ---
  redis-mailcow:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - mail-network

volumes:
  mailcow-data:
  rspamd-data:
  clamd-data:
  sogo-data:

networks:
  mail-network:
    driver: bridge
