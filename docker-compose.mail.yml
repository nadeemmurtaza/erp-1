# Mail server — reference compose file.
#
# Mailcow is deployed at /opt/mailcow-dockerized/ using the official
# mailcow-dockerized setup. This file is kept for reference only.
#
# Architecture: Traefik (Coolify) handles TLS and routes mail.yaseen.pk
# to Mailcow nginx on an internal Docker network. Ports 80/443 are NOT
# published on the host — Traefik owns them.
#
# See docs/email.md for the full setup guide.
#
# Resource usage: ~4-6 GB RAM (Rspamd + ClamAV + SOGo + MariaDB).
# Your Contabo VPS has 12 GB — leaves 6-8 GB for the store.
# BEFORE THIS DELIVERS ANYTHING, the DNS and reverse-DNS work in docs/email.md
# has to be done. As of writing, yaseen.pk has no SPF, DKIM or DMARC and its
# PTR still points at a generic Contabo hostname.
#
# Resource usage: ~4-6 GB RAM at idle (Rspamd + ClamAV + SOGo + MariaDB).
# Your Contabo VPS has 12 GB — this leaves 6-8 GB for the store.

services:
  # --- Core mail ---
  postfix-mailcow:
    image: ghcr.io/mailcow/mailcow:postfix
    restart: unless-stopped
    hostname: mail.yaseen.pk
    environment:
      TZ: Asia/Karachi
    volumes:
      - mailcow-data:/var/vmail
      - ./mailcow.conf:/etc/mailcow.conf:ro
    networks:
      - mail-network

  dovecot-mailcow:
    image: ghcr.io/mailcow/mailcow:dovecot
    restart: unless-stopped
    hostname: mail.yaseen.pk
    environment:
      TZ: Asia/Karachi
    volumes:
      - mailcow-data:/var/vmail
      - ./mailcow.conf:/etc/mailcow.conf:ro
    networks:
      - mail-network

  # --- Antispam ---
  rspamd-mailcow:
    image: ghcr.io/mailcow/mailcow:rspamd
    restart: unless-stopped
    environment:
      TZ: Asia/Karachi
    volumes:
      - rspamd-data:/var/lib/rspamd
      - ./mailcow.conf:/etc/mailcow.conf:ro
    networks:
      - mail-network

  # --- Antivirus ---
  clamd-mailcow:
    image: ghcr.io/mailcow/mailcow:clamd
    restart: unless-stopped
    environment:
      TZ: Asia/Karachi
    volumes:
      - clamd-data:/var/lib/clamav
      - ./mailcow.conf:/etc/mailcow.conf:ro
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - mail-network

  # --- Webmail + Admin UI ---
  sogo-mailcow:
    image: ghcr.io/mailcow/mailcow:sogo
    restart: unless-stopped
    environment:
      TZ: Asia/Karachi
    volumes:
      - sogo-data:/srv
      - ./mailcow.conf:/etc/mailcow.conf:ro
    networks:
      - mail-network

  nginx-mailcow:
    image: ghcr.io/mailcow/mailcow:nginx
    restart: unless-stopped
    environment:
      TZ: Asia/Karachi
    volumes:
      - ./mailcow.conf:/etc/mailcow.conf:ro
    networks:
      - mail-network

  # --- DNS resolver (internal) ---
  unbound-mailcow:
    image: ghcr.io/mailcow/mailcow:unbound
    restart: unless-stopped
    environment:
      TZ: Asia/Karachi
    networks:
      - mail-network

  # --- Cache ---
  redis-mailcow:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - mail-network

volumes:
  mailcow-data:
  rspamd-data:
  clamd-data:
  sogo-data:

networks:
  mail-network:
    driver: bridge
