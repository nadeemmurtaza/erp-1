<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img">
  <defs>

    <pattern id="motif" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#ede9e0"/>
      <rect width="8" height="8" fill="#c4ae7f" opacity="0.16"/>
      <rect x="8" y="8" width="8" height="8" fill="#c4ae7f" opacity="0.16"/>
    </pattern>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#motif)"/>
  <rect width="900" height="1200" fill="url(#shade)"/>
  <rect x="40" y="40" width="820" height="1120"
        fill="none" stroke="#c4ae7f" stroke-width="3" opacity="0.35"/>
</svg>
