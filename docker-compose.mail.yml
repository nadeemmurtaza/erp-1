# Mail stack — Stalwart mail server + SnappyMail webmail.
#
# Deployed on the same VPS as the store, in a separate Coolify project ("mail").
# Stalwart uses host networking for correct IP in outbound mail headers.
#
# Usage:
#   docker compose -f docker-compose.mail.yml --env-file .env.production up -d
#
# Ports (host network, bound by Stalwart):
#   25   - SMTP (inbound mail from other servers)
#   465  - SMTPS (submission, implicit TLS)
#   587  - Submission (STARTTLS)
#   993  - IMAPS (IMAP with TLS)
#   8080 - Admin panel (restrict in firewall to your IP)

services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16
    container_name: mail-stalwart
    restart: unless-stopped
    network_mode: host
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  snappymail:
    image: djmaze/snappymail:latest
    container_name: mail-snappymail
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - snappymail-data:/var/lib/snappymail
    security_opt:
      - no-new-privileges:true
    depends_on:
      stalwart:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8888/']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  stalwart-etc:
  stalwart-data:
  snappymail-data:
