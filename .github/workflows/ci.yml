name: CI

on:
  push:
    # `production` is the live-deploy branch (see deploy-production.yml);
    # main's push here is what gates deploy-staging.yml.
    branches: [main, production]
  pull_request:

# Least privilege: CI only ever reads the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # connection_limit/pool_timeout matter here: Prisma's default pool size is
  # derived from the runner's CPU count and GitHub-hosted runners can land on
  # as few as 3 connections, which the e2e concurrency tests (several
  # simultaneous checkouts/bookings, each holding a connection for its whole
  # transaction) exhaust — every request past the pool size then queues and
  # times out waiting for one, surfacing as a 500 with nothing wrong in the
  # code under test. Matches docker-compose.prod.yml's DATABASE_URL.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yaseen_test?schema=public&connection_limit=10&pool_timeout=20&connect_timeout=10
  JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long-000
  JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long-00
  APP_ENCRYPTION_KEY: ci-app-encryption-key-32-bytes00
  # reviews, wishlist and loyalty are on because test/customer-portal.e2e-spec.ts
  # and test/api-keys.e2e-spec.ts exercise their routes; with them off those
  # routes answer 404 and the suites fail.
  MODULES: catalog,measurements,cart,orders,payments,stitching,crm,analytics,reports,reviews,wishlist,loyalty
  PAYMENT_PROVIDERS: cod,bank_transfer
  NOTIFICATION_CHANNELS: log
  # The API's dedicated rate-limit Redis (the `redis` service below). Sign-in
  # fails closed without it, and both jobs sign in — the e2e suites and the
  # overflow sweep alike (206-rate-limiting-caching-compression-hardening.md).
  REDIS_URL: redis://localhost:6379

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector, not plain postgres: migration 20260925050000_add_ai_layer
        # runs CREATE EXTENSION vector and builds an HNSW index, which the
        # alpine image cannot do. Same major version (16), same env and health
        # check, so nothing else in this job changes.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yaseen_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm db:generate` is the API's client only. @newax/platform has its own
      # schema and its own generated client (git-ignored), and its typecheck,
      # tests and build fail with "Cannot find module '../../generated/prisma'"
      # without it. Generating needs no database.
      - name: Generate Prisma clients
        run: pnpm db:generate && pnpm --filter @newax/platform db:generate

      - name: Apply migrations
        run: pnpm --filter @newax/api db:deploy

      - name: Seed the database
        run: pnpm db:seed

      - name: Lint
        run: pnpm lint

      # The repository index (docs/index/) is generated from the code and staged
      # by .githooks/pre-commit, so a commit should always carry a matching one.
      # This catches the two ways that fails: a commit made with --no-verify, and
      # a contributor whose hooks were never installed. Both leave agents and
      # reviewers reading a map of a repository that has moved.
      - name: Index is current
        run: pnpm index:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # docs/design/process-governance/15-integrity.md's build order, check 6 (ITG-4): every route
  # at every one of Law 4's seven widths, no horizontal overflow. It needs a
  # running api + web + pos, a browser, and real sign-ins — slow enough that
  # the chapter itself says it "belong[s] in CI as their own job", not inside
  # `verify`. A separate job also means a real crash here (a boot failure, a
  # timeout) cannot block `verify`'s own, unrelated gates from reporting.
  overflow:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector, not plain postgres: migration 20260925050000_add_ai_layer
        # runs CREATE EXTENSION vector and builds an HNSW index, which the
        # alpine image cannot do. Same major version (16), same env and health
        # check, so nothing else in this job changes.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yaseen_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This sandbox's own dev environment has Chromium pre-installed at a
      # fixed path (see scripts/lib/render-harness.mjs); a GitHub-hosted
      # runner does not, so it needs the ordinary Playwright install here.
      # `--with-deps` also pulls the system libraries Chromium needs that a
      # bare `apt` image does not ship.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      # `pnpm db:generate` is the API's client only. @newax/platform has its own
      # schema and its own generated client (git-ignored), and its typecheck,
      # tests and build fail with "Cannot find module '../../generated/prisma'"
      # without it. Generating needs no database.
      - name: Generate Prisma clients
        run: pnpm db:generate && pnpm --filter @newax/platform db:generate

      - name: Apply migrations
        run: pnpm --filter @newax/api db:deploy

      - name: Seed the database
        run: pnpm db:seed

      - name: Overflow check (ITG-4)
        run: pnpm check:overflow
        env:
          # A deliberately WIDER module set than `verify`'s: every togglable
          # module except identity-verification (needs external NID_*
          # credentials this job does not have — an absent module renders as
          # an absent-module state, MOD-1, not a crash, so this costs the run
          # nothing it could otherwise cover). check-overflow.mjs's own
          # harnessEnv() sets this too; restated here so a CI failure and a
          # local run are provably testing the same surface.
          MODULES: catalog,measurements,cart,orders,payments,stitching,inventory,purchasing,production,parties,tradingpartners,crm,marketing,analytics,reports,tax,tracking,organization,accounting,pos,transfers
          SEED_ADMIN_EMAIL: admin@yaseen.pk
          SEED_ADMIN_PASSWORD: admin12345
