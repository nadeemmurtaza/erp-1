# Production stack — deployed via Docker Swarm
#
# Note: Swarm doesn't support `depends_on` or `build`. Images are pre-built
# and pushed to GHCR by GitHub Actions, then pulled here. Swarm handles startup
# order implicitly by restarting failing services until dependencies (DB) are ready.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yaseen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-yaseen}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-yaseen} -d ${POSTGRES_DB:-yaseen}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - yaseen-prod
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        failure_action: rollback

  api:
    image: ghcr.io/nadeemmurtaza/yaseenecom/api:production
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-yaseen}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yaseen}?schema=public&connection_limit=10&pool_timeout=20&connect_timeout=10
    volumes:
      - api-prod-uploads:/repo/apps/api/uploads
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - yaseen-prod
      - yaseen-edge
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 768M
      restart_policy:
        condition: any
      update_config:
        order: start-first
        failure_action: rollback

  web:
    image: ghcr.io/nadeemmurtaza/yaseenecom/web:production
    env_file: .env.production
    networks:
      - yaseen-prod
      - yaseen-edge
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 640M
      restart_policy:
        condition: any
      update_config:
        order: start-first
        failure_action: rollback

networks:
  yaseen-prod:
    name: yaseen-prod
  yaseen-edge:
    name: yaseen-edge
    external: true

volumes:
  postgres-prod-data:
  api-prod-uploads:
