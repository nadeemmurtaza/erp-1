name: Deploy to Cloudflare Pages

# Cloudflare Pages handles the build automatically when connected via GitHub
# This workflow is informational and monitors the deployment
# To activate: connect repository in Cloudflare Pages dashboard

on:
  push:
    branches: [deployment/cloudflare]

jobs:
  notify-deployment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Notify deployment started
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: 'production',
              description: 'Cloudflare Pages deployment via auto-build',
              auto_merge: false,
              production_environment: true
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'in_progress',
              environment_url: 'https://dash.cloudflare.com/pages/view/yaseenecom',
              description: 'Cloudflare Pages is building and deploying...'
            });

  verify-build:
    runs-on: ubuntu-latest
    needs: notify-deployment

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify build succeeds
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          pnpm lint
          pnpm typecheck
          pnpm build

      - name: Verify production build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          cd apps/web
          pnpm next build

      - name: Report deployment success
        uses: actions/github-script@v7
        if: success()
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.payload.deployment.id || 0,
              state: 'success',
              environment_url: 'https://yaseenecom.pages.dev',
              description: 'Deployed to Cloudflare Pages'
            }).catch(e => console.log('Deployment status update skipped'));
