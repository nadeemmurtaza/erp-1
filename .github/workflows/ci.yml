name: CI

on:
  push:
    # `production` is the live-deploy branch (see deploy-production.yml);
    # main's push here is what gates deploy-staging.yml.
    branches: [main, production]
  pull_request:

# Least privilege: CI only ever reads the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yaseen_test?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long-000
  JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long-00
  APP_ENCRYPTION_KEY: ci-app-encryption-key-32-bytes00
  MODULES: catalog,measurements,cart,orders,payments,stitching,crm,analytics,reports
  PAYMENT_PROVIDERS: cod,bank_transfer
  NOTIFICATION_CHANNELS: log

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yaseen_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm --filter @yaseen/api db:deploy

      - name: Seed the database
        run: pnpm db:seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
