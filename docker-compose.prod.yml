# Production stack — served on yaseen.pk / api.yaseen.pk via the shared
# Caddy reverse proxy (docker-compose.caddy.yml).
#
# First-time setup on the VPS (order matters — the edge network is external):
#   docker compose -f docker-compose.caddy.yml up -d          # creates yaseen-edge, once
#   cp .env.production.example .env.production                # fill in real secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# GitHub Actions CD (deploy-production.yml) runs the same `up -d --build`
# after pulling the latest commit on the production branch.

# An explicit project name, because both stacks are deployed from the SAME
# directory. Without this, Compose derives the project from the directory name
# ("yaseenecom") for prod AND staging, decides the other stack's containers are
# stale members of the one project, and tears them down on every `up` — staging
# deploys were taking production offline.
name: yaseen-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: yaseen-postgres-prod
    mem_limit: 1G
    memswap_limit: 1G
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yaseen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-yaseen}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-yaseen} -d ${POSTGRES_DB:-yaseen}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [yaseen-prod]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: yaseen-api-prod
    mem_limit: 768M
    memswap_limit: 768M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-yaseen}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yaseen}?schema=public&connection_limit=10&pool_timeout=20&connect_timeout=10
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api-prod-uploads:/repo/apps/api/uploads
    healthcheck:
      # 127.0.0.1, not localhost — Alpine's wget resolves "localhost" to ::1
      # first, but the API only binds IPv4 (0.0.0.0), so the v6 attempt gets
      # "connection refused" and the healthcheck never passes.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [yaseen-prod, yaseen-edge]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.yaseen.pk/api/v1
        NEXT_PUBLIC_SITE_URL: https://yaseen.pk
    container_name: yaseen-web-prod
    mem_limit: 640M
    memswap_limit: 640M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      api:
        condition: service_healthy
    networks: [yaseen-prod, yaseen-edge]

networks:
  yaseen-prod:
    name: yaseen-prod
  # Shared with staging — the one network Caddy (docker-compose.caddy.yml)
  # can reach both stacks' web/api containers through by service name.
  yaseen-edge:
    name: yaseen-edge
    external: true

volumes:
  postgres-prod-data:
  api-prod-uploads:
