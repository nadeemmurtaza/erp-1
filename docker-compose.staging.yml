# Staging stack — auto-deployed on every push to `main`, served on
# test.yaseen.pk / api-test.yaseen.pk via the shared Caddy reverse proxy
# (docker-compose.caddy.yml). Fully isolated Postgres/Redis from production.
#
# First-time setup on the VPS (order matters — the edge network is external):
#   docker compose -f docker-compose.caddy.yml up -d          # creates yaseen-edge, once
#   cp .env.staging.example .env.staging                       # fill in real secrets
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build
#
# GitHub Actions CD (deploy-staging.yml) runs the same `up -d --build`
# after pulling the latest commit on `main`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: yaseen-postgres-staging
    mem_limit: 640M
    memswap_limit: 640M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yaseen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-yaseen}
    volumes:
      - postgres-staging-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-yaseen} -d ${POSTGRES_DB:-yaseen}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [yaseen-staging]

  redis:
    image: redis:7-alpine
    container_name: yaseen-redis-staging
    mem_limit: 128M
    memswap_limit: 128M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    volumes:
      - redis-staging-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [yaseen-staging]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: yaseen-api-staging
    mem_limit: 512M
    memswap_limit: 512M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    env_file: .env.staging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-yaseen}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yaseen}?schema=public&connection_limit=10&pool_timeout=20&connect_timeout=10
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api-staging-uploads:/repo/apps/api/uploads
    healthcheck:
      # 127.0.0.1, not localhost — Alpine's wget resolves "localhost" to ::1
      # first, but the API only binds IPv4 (0.0.0.0), so the v6 attempt gets
      # "connection refused" and the healthcheck never passes.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [yaseen-staging, yaseen-edge]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api-test.yaseen.pk/api/v1
        NEXT_PUBLIC_SITE_URL: https://test.yaseen.pk
    container_name: yaseen-web-staging
    mem_limit: 448M
    memswap_limit: 448M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    env_file: .env.staging
    depends_on:
      api:
        condition: service_healthy
    networks: [yaseen-staging, yaseen-edge]

networks:
  yaseen-staging:
    name: yaseen-staging
  # Shared with production — the one network Caddy (docker-compose.caddy.yml)
  # can reach both stacks' web/api containers through by service name.
  yaseen-edge:
    name: yaseen-edge
    external: true

volumes:
  postgres-staging-data:
  redis-staging-data:
  api-staging-uploads:
