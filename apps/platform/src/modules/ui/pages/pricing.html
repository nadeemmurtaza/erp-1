<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pricing</title>
<style>
  :root { color-scheme: light dark; --fg: #17181c; --bg: #ffffff; --muted: #5b6068; --border: #d7d9dd; --accent: #2f5fe0; --danger: #b3261e; --ok: #1c7a3d; --surface: #f4f5f7; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f2f3f5; --bg: #121317; --muted: #a2a7b0; --border: #33363d; --accent: #7ea1ff; --danger: #ff8f87; --ok: #6fd897; --surface: #1b1c20; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 8px; text-align: center; }
  p.lede { color: var(--muted); margin: 0 auto 40px; max-width: 560px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .card { border: 1px solid var(--border); border-radius: 12px; padding: 24px; background: var(--surface); display: flex; flex-direction: column; }
  .card h2 { font-size: 18px; margin: 0 0 6px; }
  .card .price { font-size: 15px; color: var(--muted); margin: 0 0 16px; }
  .card .best-for { font-size: 13px; color: var(--muted); margin: 0 0 20px; flex-grow: 1; }
  .card .hosting { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; color: var(--accent); margin-bottom: 12px; }
  .card a.cta { display: block; text-align: center; padding: 11px; border-radius: 8px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .talk-to-us { margin-top: 48px; padding: 20px; border: 1px dashed var(--border); border-radius: 10px; text-align: center; }
  .talk-to-us a { color: var(--accent); }
  .err { color: var(--danger); text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Pricing</h1>
  <p class="lede">Three ways to run it, each trading upfront cost, recurring cost and usage risk against the others. Pick the one that matches how you want to pay.</p>

  <div class="grid" id="plans-grid">Loading…</div>

  <div class="talk-to-us" id="talk-to-us" style="display:none">
    Need per-user pricing, or something else entirely?
    <a id="talk-to-us-link" href="#">Talk to us</a>
  </div>
</main>

<script>
  // This page is served at /{apiPrefix}/ui/pricing — the API itself lives
  // one level up, at /{apiPrefix}/, exactly as /ui/signup already computes
  // it, so a rebrand or a changed PLATFORM_API_PREFIX never requires
  // editing this file.
  const apiBase = window.location.pathname.replace(/\/ui\/[^/]*$/, '/');
  const grid = document.getElementById('plans-grid');

  function esc(value) { return String(value == null ? '' : value).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

  async function load() {
    try {
      const response = await fetch(apiBase + 'pricing');
      if (!response.ok) throw new Error('Could not load pricing right now.');
      const data = await response.json();

      if (!data.plans.length) {
        // doc 154's own "the absent collaborator" — zero headline plans is
        // a real, renderable state, never a broken grid.
        grid.innerHTML = '<p class="empty">Pricing is being finalized — check back shortly, or use the link below.</p>';
      } else {
        grid.innerHTML = data.plans.map((plan) => (
          '<div class="card">' +
            '<span class="hosting">' + esc(plan.hostingMode) + '</span>' +
            '<h2>' + esc(plan.displayName) + '</h2>' +
            '<p class="price">' + esc(plan.priceDescription) + '</p>' +
            '<p class="best-for">' + esc(plan.bestFor) + '</p>' +
            '<a class="cta" href="' + apiBase + 'ui/signup?plan=' + encodeURIComponent(plan.key) + '">' + esc(plan.ctaLabel) + '</a>' +
          '</div>'
        )).join('');
      }

      if (data.contactEmail) {
        document.getElementById('talk-to-us-link').href = 'mailto:' + data.contactEmail;
        document.getElementById('talk-to-us').style.display = 'block';
      }
    } catch (error) {
      grid.innerHTML = '<p class="err">' + esc(error.message) + '</p>';
    }
  }

  load();
</script>
</body>
</html>
