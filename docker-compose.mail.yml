# Mail server — one container, no new databases.
#
#   docker compose -f docker-compose.mail.yml up -d
#
# Stalwart is an all-in-one SMTP/IMAP/JMAP server in a single Rust binary. It
# was chosen over mailcow for one reason above the others: mailcow ships its
# own MariaDB and its own Redis and cannot be pointed at existing ones, so it
# would have meant a second database engine on this box. Stalwart takes the
# Postgres and Redis that are already running.
#
# What it uses, and what it does not:
#
#   metadata      -> the existing Postgres, in its OWN database ("stalwart"),
#                    created by deploy/mail/init-postgres.sql
#   rate limits,  -> the existing Redis, on database index 1. The API declares
#   locks, ACME      ioredis but does not import it anywhere yet, so index 0 is
#                    free; using 1 keeps it that way if that changes.
#   message bodies-> a local volume, NOT Postgres. Mail bodies in the database
#                    would grow every nightly dump forever.
#
# Ports 80 and 443 stay with Caddy. Caddy fronts the admin UI over yaseen-edge
# (see the mail.yaseen.pk block in the Caddyfile) and holds the certificate;
# deploy/mail/sync-certs.sh hands it to Stalwart, which serves SMTP and IMAP
# itself and needs the cert on disk.
#
# Full setup, including the DNS records that decide whether any of this reaches
# an inbox, is in docs/email.md.

services:
  stalwart:
    image: stalwartlabs/stalwart:v0.13.4
    container_name: yaseen-stalwart
    restart: unless-stopped
    hostname: mail.yaseen.pk
    ports:
      # Inbound mail from the rest of the internet.
      - '25:25'
      # Submission — how the store, and any mail client, sends.
      - '587:587'
      - '465:465'
      # IMAP, for reading the support mailbox.
      - '143:143'
      - '993:993'
      # Deliberately NOT 80/443: Caddy owns those and reaches the admin UI
      # over the shared network instead.
    volumes:
      - stalwart-data:/opt/stalwart
      - mail-certs:/opt/stalwart/certs:ro
    networks:
      yaseen-prod:
        aliases:
          # So the API can reach it as mail.yaseen.pk over the private network.
          # Connecting to "stalwart" instead would fail TLS hostname
          # verification, since the certificate is issued for mail.yaseen.pk —
          # and the fix for that is never to switch verification off.
          - mail.yaseen.pk
      yaseen-edge:
    healthcheck:
      test: ['CMD-SHELL', 'printf "" > /dev/tcp/127.0.0.1/587 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          # It idles near 150 MB. The headroom is for message parsing and the
          # spam classifier under a burst.
          memory: 512M

volumes:
  stalwart-data:
  # Written by deploy/mail/sync-certs.sh, read-only here.
  mail-certs:

networks:
  yaseen-prod:
    name: yaseen-prod
    external: true
  yaseen-edge:
    name: yaseen-edge
    external: true
