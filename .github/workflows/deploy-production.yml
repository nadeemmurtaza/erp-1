name: Deploy production

# Fires only after CI has finished on `production` — never deploys code
# that hasn't passed lint/typecheck/test/build. Push (or merge) into
# `production` is what promotes a build from staging to live on yaseen.pk.
on:
  workflow_run:
    workflows: [CI]
    branches: [production]
    types: [completed]

# Least privilege. This workflow holds production SSH credentials, so the
# GITHUB_TOKEN it carries should be able to do as little as possible.
permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            git fetch origin production
            git checkout production
            git reset --hard origin/production
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
            docker image prune -f
