name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    branches: [production]
    types: [completed]

# Need packages: write to push to GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:production
          cache-from: type=gha,scope=api-production
          cache-to: type=gha,mode=max,scope=api-production

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.yaseen.pk/api/v1
            NEXT_PUBLIC_SITE_URL=https://yaseen.pk
          push: true
          tags: ghcr.io/${{ github.repository }}/web:production
          cache-from: type=gha,scope=web-production
          cache-to: type=gha,mode=max,scope=web-production

      - name: Copy stack file to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-stack.prod.yml"
          target: "${{ secrets.VPS_DEPLOY_PATH }}"

      - name: Deploy to Docker Swarm over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            
            # We no longer use `git checkout` on the server! The GHCR pipeline and
            # SCP action handle code/config delivery, completely eliminating the 
            # race condition between staging and production deploys.
            
            # Pull the new images so the migration container uses the latest code
            docker pull ghcr.io/${{ github.repository }}/api:production
            
            # Run database migrations BEFORE the rolling update
            echo "Running database migrations..."
            docker run --rm \
              --env-file .env.production \
              --network yaseen-prod \
              ghcr.io/${{ github.repository }}/api:production \
              sh -c "node_modules/.bin/prisma migrate deploy --schema prisma/schema"
            
            # Pre-render the stack file with environment variables from .env.production
            echo "Deploying Swarm Stack..."
            docker compose -f docker-stack.prod.yml --env-file .env.production config | \
              docker stack deploy -c - yaseen-prod --with-registry-auth
