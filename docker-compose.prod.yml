# Production stack — served on yaseen.pk / api.yaseen.pk via the shared
# Caddy reverse proxy (docker-compose.caddy.yml).
#
# First-time setup on the VPS (order matters — the edge network is external):
#   docker compose -f docker-compose.caddy.yml up -d          # creates yaseen-edge, once
#   cp .env.production.example .env.production                # fill in real secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# GitHub Actions CD (deploy-production.yml) runs the same `up -d --build`
# after pulling the latest commit on the production branch.

services:
  postgres:
    image: postgres:16-alpine
    container_name: yaseen-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yaseen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-yaseen}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-yaseen} -d ${POSTGRES_DB:-yaseen}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [yaseen-prod]

  redis:
    image: redis:7-alpine
    container_name: yaseen-redis-prod
    restart: unless-stopped
    volumes:
      - redis-prod-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [yaseen-prod]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: yaseen-api-prod
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-yaseen}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yaseen}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api-prod-uploads:/repo/apps/api/uploads
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [yaseen-prod, yaseen-edge]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.yaseen.pk/api/v1
        NEXT_PUBLIC_SITE_URL: https://yaseen.pk
    container_name: yaseen-web-prod
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      api:
        condition: service_healthy
    networks: [yaseen-prod, yaseen-edge]

networks:
  yaseen-prod:
    name: yaseen-prod
  # Shared with staging — the one network Caddy (docker-compose.caddy.yml)
  # can reach both stacks' web/api containers through by service name.
  yaseen-edge:
    name: yaseen-edge
    external: true

volumes:
  postgres-prod-data:
  redis-prod-data:
  api-prod-uploads:
