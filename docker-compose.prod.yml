# Production stack — served on yaseen.pk / api.yaseen.pk via the shared
# Caddy reverse proxy (docker-compose.caddy.yml).
#
# First-time setup on the VPS (order matters — the edge network is external):
#   docker compose -f docker-compose.caddy.yml up -d          # creates yaseen-edge, once
#   cp .env.production.example .env.production                # fill in real secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# GitHub Actions CD (deploy-production.yml) runs the same `up -d --build`
# after pulling the latest commit on the production branch.

# An explicit project name, because both stacks are deployed from the SAME
# directory. Without this, Compose derives the project from the directory name
# ("yaseenecom") for prod AND staging, decides the other stack's containers are
# stale members of the one project, and tears them down on every `up` — staging
# deploys were taking production offline.
name: yaseen-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: yaseen-postgres-prod
    mem_limit: 1G
    memswap_limit: 1G
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yaseen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-yaseen}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-yaseen} -d ${POSTGRES_DB:-yaseen}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [yaseen-prod]

  # The API's dedicated Redis (206-rate-limiting-caching-compression-hardening.md
  # §1.2, WO-206.1): rate-limit counters shared across API replicas and the
  # per-account sign-in bucket. A separate instance from the mail server's
  # Redis (docker-compose.mail.yml, MAIL_REDIS_URL), so a mail incident and a
  # rate-limiting incident never share a blast radius. Internal network only,
  # password required anyway.
  #   --save '' / --appendonly no — nothing in it is a fact; a restart only
  #     resets counters, so there is no volume to back up.
  #   --maxmemory 64mb — rate-limit keys are ~200 bytes each (a per-IP hit
  #     counter and block flag per route an address touched in the last
  #     minute, a bucket per identifier with recent failures); 64 MB holds
  #     ~300k of them, roughly 3x a busy single-brand minute.
  #   --maxmemory-policy noeviction — evicting a counter would silently reset
  #     someone's limit, a fail-open. Full, it refuses writes instead, which
  #     the API treats as Redis being down (sign-in 503, global limit per
  #     process) and logs.
  #   mem_limit 128M — 64 MB of data plus fragmentation and Redis's own ~5 MB.
  redis:
    image: redis:7-alpine
    container_name: yaseen-redis-prod
    mem_limit: 128M
    memswap_limit: 128M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [yaseen-prod]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: yaseen-api-prod
    mem_limit: 768M
    memswap_limit: 768M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-yaseen}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yaseen}?schema=public&connection_limit=10&pool_timeout=20&connect_timeout=10
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      # Started first, never waited on: Redis is not a boot dependency — the
      # API boots without it and refuses only sign-in until it connects.
      redis:
        condition: service_started
    volumes:
      - api-prod-uploads:/repo/apps/api/uploads
    healthcheck:
      # 127.0.0.1, not localhost — Alpine's wget resolves "localhost" to ::1
      # first, but the API only binds IPv4 (0.0.0.0), so the v6 attempt gets
      # "connection refused" and the healthcheck never passes.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [yaseen-prod, yaseen-edge]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.yaseen.pk/api/v1
        NEXT_PUBLIC_SITE_URL: https://yaseen.pk
    container_name: yaseen-web-prod
    mem_limit: 640M
    memswap_limit: 640M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      api:
        condition: service_healthy
    networks: [yaseen-prod, yaseen-edge]

networks:
  yaseen-prod:
    name: yaseen-prod
  # Shared with staging — the one network Caddy (docker-compose.caddy.yml)
  # can reach both stacks' web/api containers through by service name.
  yaseen-edge:
    name: yaseen-edge
    external: true

volumes:
  postgres-prod-data:
  api-prod-uploads:
