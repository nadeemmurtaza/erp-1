name: Deploy staging

# Fires only after CI has finished on `main` — never deploys code that
# hasn't passed lint/typecheck/test/build. See deploy-production.yml for
# the equivalent on the `production` branch.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

# Least privilege. This workflow holds deploy SSH credentials, so the
# GITHUB_TOKEN it carries should be able to do as little as possible.
permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build
            docker image prune -f
